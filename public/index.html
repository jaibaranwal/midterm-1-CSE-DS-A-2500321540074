<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Product Inventory Management System</h1>
    <p>FSD Workshop 1 &middot; CSE DS A</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Add Product</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <input type="text" id="name" placeholder="Name" required>
        <input type="number" id="price" placeholder="Price" required>
        <input type="text" id="category" placeholder="Category" required>
        <button type="submit" id="saveBtn">Add</button>
        <button type="button" id="cancelBtn" class="secondary" hidden>Cancel</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Products</h2>
        <div>
          <input type="number" id="searchId" placeholder="Search by ID">
          <button id="searchBtn">Search</button>
          <button id="showAllBtn" class="secondary">Show All</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Price</th><th>Category</th><th>Actions</th></tr>
        </thead>
        <tbody id="productBody"></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
